# Gaia Korean dataset collector config
# Unit examples: 10GB, 500MB, 1024KB
root_dir: ./gaia_test_200g_kr80_no_ocr
user_agent: "gaia-test-collector/1.0 (+internal-poc; respect robots; contact: your-email@example.com)"
request_timeout_sec: 30
sleep_sec: 1.0
max_retries: 3
parallel_workers: 5

# Quota is now tracked per document TYPE, not per source.
# Run any source repeatedly — duplicates are skipped via manifest.csv.
quotas:
  total: 100GB
  by_type:
    pdf:          20GB
    docx_doc:     20GB
    xlsx_xls_csv: 20GB
    txt:          20GB
    json_xml:     20GB

# Keep only file types Gaia can ingest directly or with minimal handling.
allowed_extensions:
  - .pdf
  - .csv
  - .xlsx
  - .xls
  - .xml
  - .json
  - .txt
  - .docx
  - .doc

# Crawl depth / page limits — increase if a source produces fewer files than expected.
generic_crawl:
  max_pages_per_site: 5000
  max_depth: 4

# ---------------------------------------------------------------------------
# Sources — add more seed_urls to any section to increase yield.
# There are no per-source quotas; run a source as many times as needed.
# ---------------------------------------------------------------------------

