# Gaia Korean dataset collector config
# Unit examples: 10GB, 500MB, 1024KB
root_dir: ../../gaia_web_dataset  # 2026-07-15: cohesity-poc/gaia_web_dataset로 이전 (구 경로: ./gaia_test_200g_kr80_no_ocr). 상대경로 유지 — 다른 머신으로 옮겨도 collector/gaia_kr_collector 기준 위치만 맞으면 그대로 동작
user_agent: "gaia-test-collector/1.0 (+internal-poc; respect robots; contact: your-email@example.com)"
request_timeout_sec: 30
sleep_sec: 1.0
max_retries: 3
parallel_workers: 5

# Quota is now tracked per document TYPE, not per source.
# Run any source repeatedly — duplicates are skipped via manifest.csv.
quotas:
  total: 110GB
  by_type:
    pdf:          35GB   # .pdf
    docx_doc:     30GB   # .doc .docx .odf .rtf
    xlsx_xls_csv: 15GB   # .xls .xlsx .csv
    ppt_pptx:     10GB   # .ppt .pptx
    txt:          20GB   # .txt .html
  # 한국어 소스가 부족한 타입은 영어 소스로 보충 허용 (한국어 70% / 영어 30%).
  # lang: en 태그가 붙은 소스는 여기 지정된 비율(타입 quota 대비)까지만 채워짐.
  lang_cap:
    docx_doc:  0.3
    ppt_pptx:  0.3

# Cohesity Gaia 지원 타입
allowed_extensions:
  - .pdf
  - .doc
  - .docx
  - .odf
  - .rtf
  - .xls
  - .xlsx
  - .csv
  - .ppt
  - .pptx
  - .txt
  - .html
  - .xml

# Crawl depth / page limits — increase if a source produces fewer files than expected.
generic_crawl:
  max_pages_per_site: 5000
  max_depth: 4

