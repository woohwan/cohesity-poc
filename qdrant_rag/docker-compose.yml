services:

  qdrant:
    image: qdrant/qdrant:latest
    container_name: cohesity-qdrant
    ports:
      - "6333:6333"
    volumes:
      - ./qdrant_storage:/qdrant/storage
    restart: unless-stopped

  embed-server:
    build:
      context: ..
      dockerfile: qdrant_rag/Dockerfile
      args:
        UID: ${HOST_UID:-1000}
        GID: ${HOST_GID:-1000}
    container_name: cohesity-embed-server
    command: python embed_server.py
    ports:
      - "8765:8765"
    volumes:
      - ${HOME}/.cache/huggingface:/app/hf_cache
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN:-}
      - EMBED_MODEL=${EMBED_MODEL:-jhgan/ko-sroberta-multitask}
      - EMBED_DIMENSION=${EMBED_DIMENSION:-768}
      - EMBED_BATCH_SIZE=${EMBED_BATCH_SIZE:-64}
      - USE_HYBRID_SEARCH=${USE_HYBRID_SEARCH:-true}
      - BM25_MODEL=${BM25_MODEL:-Qdrant/bm25}
      - HF_HOME=/app/hf_cache
      - CUDA_VISIBLE_DEVICES=${EMBED_SERVER_GPU:-0}
      - EMBED_SERVER_PORT=8765
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  qdrant-rag:
    build:
      context: ..
      dockerfile: qdrant_rag/Dockerfile
      args:
        UID: ${HOST_UID:-1000}
        GID: ${HOST_GID:-1000}
    container_name: cohesity-qdrant-rag
    volumes:
      - ../gaia_dataset:/data/gaia_dataset:ro
      - ./output:/app/output
      - ${HOME}/.cache/huggingface:/app/hf_cache
    environment:
      - LLM_PROVIDER=${LLM_PROVIDER:-claude}
      - LLM_MODEL=${LLM_MODEL:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - CLAUDE_MODEL=${CLAUDE_MODEL:-claude-sonnet-4-6}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-5.4-mini}
      - OPENAI_MAX_OUTPUT_TOKENS=${OPENAI_MAX_OUTPUT_TOKENS:-4096}
      - OPENAI_REASONING_EFFORT=${OPENAI_REASONING_EFFORT:-minimal}
      - RAGAS_OPENAI_MODEL=${RAGAS_OPENAI_MODEL:-gpt-4o-mini}
      - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN:-}
      - EMBED_MODEL=${EMBED_MODEL:-jhgan/ko-sroberta-multitask}
      - EMBED_DIMENSION=${EMBED_DIMENSION:-768}
      - EMBED_BATCH_SIZE=${EMBED_BATCH_SIZE:-64}
      - USE_HYBRID_SEARCH=${USE_HYBRID_SEARCH:-true}
      - BM25_MODEL=${BM25_MODEL:-Qdrant/bm25}
      - HF_HOME=/app/hf_cache
      - CUDA_VISIBLE_DEVICES=${CUDA_VISIBLE_DEVICES:-0}
      - QDRANT_URL=http://qdrant:6333
      - EMBED_SERVER_URL=http://embed-server:8765
      - GAIA_DATASET_DIR=/data/gaia_dataset
      - OUTPUT_DIR=/app/output
      - LOG_INTERVAL=${LOG_INTERVAL:-1000}
    depends_on:
      - qdrant
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    stdin_open: true
    tty: true
