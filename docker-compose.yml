services:

  # ── Qdrant 벡터 DB ──────────────────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:latest
    container_name: cohesity-qdrant
    ports:
      - "6333:6333"
    volumes:
      - ./qdrant_rag/qdrant_storage:/qdrant/storage
    restart: unless-stopped

  # ── QA 생성 / RAGAS 평가 ────────────────────────────────────────────────────
  gaia-ragas:
    build:
      context: .
      dockerfile: gaia_ragas/Dockerfile
      args:
        UID: ${HOST_UID:-1000}
        GID: ${HOST_GID:-1000}
    container_name: cohesity-gaia-ragas
    volumes:
      - ./gaia_dataset:/data/gaia_dataset:ro   # dataset1/2/3 통합본
      - ./gaia_ragas/output:/app/output
    environment:
      - LLM_PROVIDER=${LLM_PROVIDER:-claude}
      - LLM_MODEL=${LLM_MODEL:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - CLAUDE_MODEL=${CLAUDE_MODEL:-claude-sonnet-4-6}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-5-mini}
      - OPENAI_MAX_OUTPUT_TOKENS=${OPENAI_MAX_OUTPUT_TOKENS:-4096}
      - OPENAI_REASONING_EFFORT=${OPENAI_REASONING_EFFORT:-minimal}
      - RAGAS_OPENAI_MODEL=${RAGAS_OPENAI_MODEL:-gpt-4o-mini}
      - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN:-}
      - GAIA_DATASET_DIR=/data/gaia_dataset
      - OUTPUT_DIR=/app/output
    stdin_open: true
    tty: true

  # ── Qdrant RAG 인제스트 / 검색 / 평가 ──────────────────────────────────────
  qdrant-rag:
    build:
      context: .
      dockerfile: qdrant_rag/Dockerfile
      args:
        UID: ${HOST_UID:-1000}
        GID: ${HOST_GID:-1000}
    container_name: cohesity-qdrant-rag
    volumes:
      - ./gaia_dataset:/data/gaia_dataset:ro
      - ./qdrant_rag/output:/app/output
      - ${HOME}/.cache/huggingface:/app/hf_cache
    environment:
      - LLM_PROVIDER=${LLM_PROVIDER:-claude}
      - LLM_MODEL=${LLM_MODEL:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - CLAUDE_MODEL=${CLAUDE_MODEL:-claude-sonnet-4-6}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-5-mini}
      - OPENAI_MAX_OUTPUT_TOKENS=${OPENAI_MAX_OUTPUT_TOKENS:-4096}
      - OPENAI_REASONING_EFFORT=${OPENAI_REASONING_EFFORT:-minimal}
      - RAGAS_OPENAI_MODEL=${RAGAS_OPENAI_MODEL:-gpt-4o-mini}
      - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN:-}
      - EMBED_MODEL=${EMBED_MODEL:-jhgan/ko-sroberta-multitask}
      - EMBED_DIMENSION=${EMBED_DIMENSION:-768}
      - HF_HOME=/app/hf_cache
      - CUDA_VISIBLE_DEVICES=${CUDA_VISIBLE_DEVICES:-0}
      - QDRANT_URL=http://qdrant:6333
      - GAIA_DATASET_DIR=/data/gaia_dataset
      - OUTPUT_DIR=/app/output
    depends_on:
      - qdrant
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    stdin_open: true
    tty: true
